<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F0D0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#grad4)"/>

  <!-- Money/coins -->
  <g transform="translate(80, 80)">
    <!-- Coin 1 -->
    <circle cx="30" cy="50" r="20" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
    <text x="30" y="58" font-family="Arial" font-size="24" font-weight="bold" fill="#DAA520" text-anchor="middle">€</text>

    <!-- Coin 2 (overlapping) -->
    <circle cx="55" cy="60" r="18" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
    <text x="55" y="67" font-family="Arial" font-size="20" font-weight="bold" fill="#DAA520" text-anchor="middle">€</text>

    <!-- Coin 3 (overlapping) -->
    <circle cx="75" cy="55" r="16" fill="#C0AF60" stroke="#DAA520" stroke-width="2"/>
    <text x="75" y="62" font-family="Arial" font-size="18" font-weight="bold" fill="#FFF" text-anchor="middle">€</text>
  </g>

  <!-- Calendar days -->
  <g transform="translate(220, 90)">
    <g>
      <rect x="0" y="0" width="45" height="45" fill="#FFF" stroke="#001F5C" stroke-width="2" rx="3"/>
      <text x="22" y="28" font-family="Arial" font-size="24" font-weight="bold" fill="#001F5C" text-anchor="middle">1</text>
    </g>
    <g>
      <rect x="50" y="0" width="45" height="45" fill="#001F5C" rx="3"/>
      <text x="72" y="28" font-family="Arial" font-size="24" font-weight="bold" fill="#FFD700" text-anchor="middle">2</text>
    </g>
    <g>
      <rect x="25" y="50" width="45" height="45" fill="#FFF" stroke="#001F5C" stroke-width="2" rx="3"/>
      <text x="47" y="78" font-family="Arial" font-size="24" font-weight="bold" fill="#001F5C" text-anchor="middle">3</text>
    </g>
  </g>
</svg>