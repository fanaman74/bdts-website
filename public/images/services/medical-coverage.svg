<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F4D0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#grad2)"/>

  <!-- Prescription clipboard -->
  <g transform="translate(100, 60)">
    <!-- Clipboard -->
    <rect x="0" y="0" width="120" height="140" fill="#FFF" stroke="#001F5C" stroke-width="3" rx="4"/>

    <!-- Clip -->
    <rect x="40" y="-8" width="40" height="12" fill="#001F5C" rx="2"/>

    <!-- Paper lines (prescription) -->
    <line x1="15" y1="20" x2="105" y2="20" stroke="#999" stroke-width="2"/>
    <line x1="15" y1="35" x2="105" y2="35" stroke="#999" stroke-width="2"/>
    <line x1="15" y1="50" x2="90" y2="50" stroke="#999" stroke-width="2"/>

    <!-- Prescription Rx symbol -->
    <text x="70" y="65" font-family="Arial" font-size="20" font-weight="bold" fill="#D32F2F">Rx</text>

    <!-- Bottom lines -->
    <line x1="15" y1="80" x2="105" y2="80" stroke="#999" stroke-width="1.5"/>
    <line x1="15" y1="95" x2="105" y2="95" stroke="#999" stroke-width="1.5"/>
    <line x1="15" y1="110" x2="85" y2="110" stroke="#999" stroke-width="1.5"/>
  </g>

  <!-- Doctor icon accent -->
  <g transform="translate(280, 100)" opacity="0.4">
    <circle cx="20" cy="15" r="12" fill="#001F5C"/>
    <path d="M 5 35 Q 5 28 20 28 Q 35 28 35 35 L 35 50 L 5 50 Z" fill="#001F5C"/>
  </g>
</svg>