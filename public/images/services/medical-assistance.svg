<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF0E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8E0D0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#grad3)"/>

  <!-- Ambulance -->
  <g transform="translate(50, 100)">
    <!-- Body -->
    <rect x="0" y="30" width="140" height="70" fill="#FFF" stroke="#D32F2F" stroke-width="3" rx="4"/>

    <!-- Cabin -->
    <rect x="90" y="15" width="50" height="25" fill="#D32F2F" rx="2"/>

    <!-- Windows -->
    <rect x="100" y="20" width="15" height="15" fill="#B8E0FF" stroke="#001F5C" stroke-width="1"/>
    <rect x="120" y="20" width="15" height="15" fill="#B8E0FF" stroke="#001F5C" stroke-width="1"/>

    <!-- Red Cross -->
    <line x1="25" y1="50" x2="25" y2="70" stroke="#D32F2F" stroke-width="6"/>
    <line x1="15" y1="60" x2="35" y2="60" stroke="#D32F2F" stroke-width="6"/>

    <!-- Wheels -->
    <circle cx="30" cy="105" r="8" fill="#333"/>
    <circle cx="110" cy="105" r="8" fill="#333"/>

    <!-- Siren light -->
    <circle cx="120" cy="10" r="6" fill="#FFD700" stroke="#D32F2F" stroke-width="2"/>
  </g>

  <!-- Medical cross accent -->
  <g transform="translate(270, 120)" opacity="0.3">
    <rect x="-15" y="-3" width="30" height="6" fill="#D32F2F"/>
    <rect x="-3" y="-15" width="6" height="30" fill="#D32F2F"/>
  </g>
</svg>